<div class="login-wrapper">
  <form class="login-card" [formGroup]="form" (ngSubmit)="onSubmit()">
    <h1 class="login-title">Panel de Administración</h1>
    <p class="login-subtitle">Ingresá tus credenciales para continuar</p>

    <label class="field">
      <span class="field-label">Email</span>
      <input
        type="email"
        formControlName="email"
        class="input"
        placeholder="admin@empresa.com"
      />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <span class="error-text">Ingresá un email válido.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Contraseña</span>
      <input
        type="password"
        formControlName="password"
        class="input"
        placeholder="••••••••"
      />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <span class="error-text">La contraseña es obligatoria.</span>
      }
    </label>

    @if (error) {
      <div class="alert error">{{ error }}</div>
    }

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
      {{ loading ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</div>
